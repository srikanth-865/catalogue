//This file tells SonarQube which project to analyze and which files to scan or excludes

//we tell to sonar identify project name is roboshop-catalogue.
sonar.projectKey=roboshop-catalogue  
//we are telling to sonar Display name is roboshop-catalogue.
sonar.projectName=roboshop-catalogue
//Look for source code in the current project directory and its subdirectories.  
sonar.sources=. 
 //skip the listed files and directories during source analysis.
sonar.exclusions=node_modules/**,Jenkinsfile, Dockerfile, coverage/**,test/**,.git/** 




sonar.tests=test
sonar.test.inclusions=test/**/*.test.js
# Coverage report generated by Jest (lcov format)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Test results in JUnit XML format generated by jest-junit
sonar.junit.reportPaths=junit.xml