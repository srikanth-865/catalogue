//This file tells SonarQube which project to analyze and which files to scan or excludes

sonar.projectKey=roboshop-catalogue  //we tell to sonar identify project name is roboshop-catalogue.
sonar.projectName=roboshop-catalogue //we are telling to sonar Display name is roboshop-catalogue.
sonar.sources=. //Look for source code in the current project directory and its subdirectories.
sonar.exclusions=node_modules/**,Jenkinsfile, Dockerfile, coverage/**,test/**,.git/**  //skip the listed files and directories during source analysis.